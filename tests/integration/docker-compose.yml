name: harbor-transfer-integration
services:
  ftp:
    build:
      context: .
      dockerfile: Dockerfile.ftp
    environment:
      PASV_MIN_PORT: "30000"
      PASV_MAX_PORT: "30009"
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 21), 1).close()\""]
      interval: 2s
      timeout: 2s
      retries: 20
  ftps:
    build:
      context: .
      dockerfile: Dockerfile.ftp
    environment:
      FTP_TLS: "1"
      PASV_MIN_PORT: "30100"
      PASV_MAX_PORT: "30109"
    ports:
      - "2990:21"
      - "30100-30109:30100-30109"
    volumes:
      - ./.certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 21), 1).close()\""]
      interval: 2s
      timeout: 2s
      retries: 20
  sftp:
    image: atmoz/sftp:alpine
    command: harbor:harbor:1001::upload
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 20
  webdav:
    build:
      context: .
      dockerfile: Dockerfile.webdav
    ports:
      - "8443:8443"
    volumes:
      - ./.certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,ssl; c=ssl._create_unverified_context().wrap_socket(socket.socket(),server_hostname='localhost'); c.settimeout(1); c.connect(('127.0.0.1',8443)); c.close()\""]
      interval: 2s
      timeout: 2s
      retries: 20
  nextcloud:
    image: nextcloud:32-apache
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: harbor
      NEXTCLOUD_ADMIN_PASSWORD: harbor
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud"
      OVERWRITEPROTOCOL: https
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 3s
      timeout: 3s
      retries: 60
  nextcloud-https:
    image: nginx:1.29-alpine
    depends_on:
      nextcloud:
        condition: service_healthy
    ports:
      - "8444:8444"
    volumes:
      - ./.certs:/certs:ro
      - ./nextcloud-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8444/status.php"]
      interval: 3s
      timeout: 3s
      retries: 30
  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: harboraccess
      MINIO_ROOT_PASSWORD: harborsecret123
    ports:
      - "${S3_TEST_HOST_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
  samba:
    image: dperson/samba:latest
    command: '-u "harbor;harbor" -s "Documents;/share;yes;no;no;harbor" -s "ReadOnly;/readonly;yes;yes;no;harbor" -g "server min protocol = SMB2"'
    ports:
      - "1445:445"
    tmpfs:
      - /share
      - /readonly
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L //127.0.0.1 -U 'harbor%harbor' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
