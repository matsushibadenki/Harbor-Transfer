services:
  ftps:
    # Docker's Linux port-forwarding layer can retain a TLS data socket after
    # the client has closed it, so pyftpdlib never emits the FTP 226 response.
    # Use the runner's network directly to exercise the real FTPS shutdown
    # handshake instead of testing the NAT proxy's connection lifecycle.
    network_mode: host
    ports: !reset []
    environment:
      FTP_PORT: "2990"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 2990), 1).close()\""]
