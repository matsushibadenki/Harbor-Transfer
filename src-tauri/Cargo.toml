[package]
name = "harbor-transfer"
version = "0.1.0"
description = "A secure file transfer client"
edition = "2021"

[lib]
name = "harbor_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
anyhow = "1"
keyring = "3"
async-std = "1"
async-trait = "0.1"
russh = { version = "0.44", features = ["openssl", "vendored-openssl"] }
russh-keys = "0.44"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suppaftp = { version = "6", features = ["async-native-tls"] }
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
