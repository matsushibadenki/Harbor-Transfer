[package]
name = "harbor-transfer"
version = "0.2.3"
description = "A secure file transfer client"
edition = "2021"

[lib]
name = "harbor_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
anyhow = "1"
keyring = { version = "3", features = ["apple-native"] }
futures-util = "0.3"
percent-encoding = "2"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
async-trait = "0.1"
russh = { version = "0.44", features = ["openssl", "vendored-openssl"] }
# RustCrypto's key parser adds native PuTTY PPK v2/v3 support while the
# connection transport remains on the established russh implementation.
ssh-key-ppk = { package = "ssh-key", version = "=0.7.0-rc.11", features = ["crypto", "ppk"] }
russh-keys = "0.44"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suppaftp = { version = "10.0.2", features = ["tokio-rustls-ring"] }
rustls-platform-verifier = "0.7"
rustls-pemfile = "2"
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-drag = "2.1.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = "0.3"
aws-config = { version = "=1.8.18", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = "=1.137.0"
aws-credential-types = "=1.2.14"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
smb2 = "0.20"

[dev-dependencies]
tempfile = "3"
