[package]
name = "harbor-transfer"
version = "0.1.0"
description = "A secure file transfer client"
edition = "2021"

[lib]
name = "harbor_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
anyhow = "1"
keyring = "3"
futures-util = "0.3"
percent-encoding = "2"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
async-trait = "0.1"
russh = { version = "0.44", features = ["openssl", "vendored-openssl"] }
russh-keys = "0.44"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suppaftp = { version = "10.0.2", features = ["tokio-async-native-tls"] }
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-drag = "2.1.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
