<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fffaf0" />
    <link rel="alternate" hreflang="ja" href="jp/" />
    <link rel="alternate" hreflang="en" href="en/" />
    <link rel="alternate" hreflang="zh-CN" href="zh/" />
    <link rel="alternate" hreflang="x-default" href="en/" />
    <title>Harbor Transfer</title>
    <script>
      (() => {
        const locale = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase();
        const destination = locale.startsWith('ja') ? 'jp/' : locale.startsWith('zh') ? 'zh/' : 'en/';
        window.location.replace(destination);
      })();
    </script>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #0d2440; background: #fffaf0; font: 16px/1.7 -apple-system, BlinkMacSystemFont, sans-serif; }
      main { width: min(520px, calc(100vw - 32px)); text-align: center; }
      h1 { margin: 0 0 12px; color: #18796e; }
      nav { display: flex; justify-content: center; gap: 18px; margin-top: 24px; }
      a { color: #18796e; font-weight: 700; text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Harbor Transfer</h1>
      <p>Select your language / 言語を選択 / 选择语言</p>
      <nav aria-label="Language">
        <a href="jp/" lang="ja">日本語</a>
        <a href="en/" lang="en">English</a>
        <a href="zh/" lang="zh-CN">简体中文</a>
      </nav>
    </main>
  </body>
</html>
